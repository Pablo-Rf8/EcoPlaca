<header class="eco-navbar-wrapper">
  <div class="eco-nav-container">
    <a routerLink="/" class="eco-brand" (click)="closeMenu()">
      <div class="logo-icon">🌿</div>
      <div class="brand-text">
        <span class="brand-name">Eco<span class="accent">Placa</span></span>
        <span class="brand-tagline">Trazabilidad RAEE</span>
      </div>
    </a>

    <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav-links" [class.open]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
        Inicio
      </a>
      <a routerLink="/galeria" routerLinkActive="active" (click)="closeMenu()">
        Galería de Dispositivos
      </a>
      <a routerLink="/comentarios" routerLinkActive="active" (click)="closeMenu()">
        Comentarios y Notas
      </a>

      <div class="user-badge">
        <span class="status-indicator"></span>
        <span class="user-role">{{ usuarioActivo() }}</span>
      </div>
    </nav>
  </div>
</header>
