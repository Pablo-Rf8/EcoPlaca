<header class="eco-navbar-wrapper">
  <div class="container eco-nav-container">
    <a routerLink="/" class="eco-brand" (click)="closeMenu()">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          <circle cx="12" cy="12" r="5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Eco<span class="accent">Placa</span></span>
        <span class="brand-tagline">Economía Circular & RAEE</span>
      </div>
    </a>

    <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav-links" [class.open]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
        <span class="icon">🌿</span> Catálogo Rescate
      </a>
      <a routerLink="/impact" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon">📊</span> Impacto Ambiental
      </a>
      <a routerLink="/reservations" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon">📦</span> Gestión Reservas
      </a>
      <a routerLink="/donate" routerLinkActive="active" (click)="closeMenu()" class="btn-donate">
        <span>+</span> Donar Hardware
      </a>

      <div class="user-badge" title="Sesión activa">
        <span class="status-indicator"></span>
        <span class="user-role">{{ activeRole() }}</span>
      </div>
    </nav>
  </div>
</header>
